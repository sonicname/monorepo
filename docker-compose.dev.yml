services:
  postgres:
    image: postgres:17-alpine
    container_name: monorepo-postgres-dev
    environment:
      POSTGRES_DB: monorepo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d monorepo']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: monorepo-redis-dev
    ports:
      - '6379:6379'
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: node:24-alpine
    container_name: monorepo-api-dev
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      API_PORT: '3001'
      API_URL: http://api:3001
      WEB_PORT: '5173'
      WEB_URL: http://web:5173
      PUBLIC_API_BASE_PATH: /api
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/monorepo
      BULLMQ_ENABLED: 'true'
      REDIS_URL: redis://redis:6379
      BULLMQ_PREFIX: monorepo
      CHOKIDAR_USEPOLLING: 'true'
    command:
      - sh
      - -lc
      - corepack enable && pnpm install && pnpm run build:packages && pnpm run db:push && pnpm --filter api dev
    ports:
      - '3001:3001'
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - pnpm-store:/pnpm/store

  web:
    image: node:24-alpine
    container_name: monorepo-web-dev
    working_dir: /workspace
    depends_on:
      api:
        condition: service_started
    environment:
      WEB_PORT: '5173'
      WEB_URL: http://web:5173
      API_PORT: '3001'
      API_URL: http://api:3001
      PUBLIC_API_BASE_PATH: /api
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/monorepo
      BULLMQ_ENABLED: 'true'
      REDIS_URL: redis://redis:6379
      BULLMQ_PREFIX: monorepo
      CHOKIDAR_USEPOLLING: 'true'
    command:
      - sh
      - -lc
      - corepack enable && pnpm install && pnpm run build:packages && pnpm --filter web dev --host 0.0.0.0
    ports:
      - '5173:5173'
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - pnpm-store:/pnpm/store

volumes:
  node_modules:
  pnpm-store:
  postgres-data:
  redis-data:
