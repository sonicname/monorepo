services:
  traefik:
    image: traefik:v3
    container_name: monorepo-traefik-dev
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - '80:80'
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:17-alpine
    container_name: monorepo-postgres-dev
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: monorepo-redis-dev
    ports:
      - '6379:6379'
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: monorepo-rabbitmq-dev
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
      interval: 5s
      timeout: 5s
      retries: 12

  mongodb:
    image: mongo:8-noble
    container_name: monorepo-mongodb-dev
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: monorepo-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  maildev:
    image: maildev/maildev:2.1.0
    container_name: monorepo-maildev-dev
    ports:
      - '1080:1080'
      - '1025:1025'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:1080/healthz']
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    image: node:24-alpine
    container_name: monorepo-auth-dev
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTH_PORT: '3002'
      AUTH_GRPC_PORT: '5001'
      AUTH_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/monorepo_auth
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-prod
      SMTP_HOST: maildev
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      SMTP_FROM: noreply@monorepo.dev
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: monorepo-uploads
      S3_REGION: us-east-1
      CHOKIDAR_USEPOLLING: 'true'
    command:
      - sh
      - -lc
      - corepack enable && pnpm install && pnpm run build:packages && pnpm run db:push:auth && pnpm --filter auth dev
    ports:
      - '3002:3002'
      - '5001:5001'
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - pnpm-store:/pnpm/store
    labels:
      - traefik.enable=true
      # Route /api/v1/auth/* to the auth service (no JWT middleware — login/register are public)
      - traefik.http.routers.auth.rule=PathPrefix(`/api/v1/auth`)
      - traefik.http.routers.auth.entrypoints=web
      - traefik.http.services.auth.loadbalancer.server.port=3002
      # Define the forwardAuth middleware here so it can be referenced by other routers
      - traefik.http.middlewares.jwt-verify.forwardauth.address=http://auth:3002/api/v1/auth/verify
      - traefik.http.middlewares.jwt-verify.forwardauth.authResponseHeaders=X-User-Id,X-User-Email,X-User-Username,X-User-Role

  api:
    image: node:24-alpine
    container_name: monorepo-api-dev
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      API_PORT: '3001'
      API_URL: http://api:3001
      WEB_PORT: '5173'
      WEB_URL: http://web:5173
      PUBLIC_API_BASE_PATH: /api/v1
      API_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/monorepo_api
      BULLMQ_ENABLED: 'true'
      REDIS_URL: redis://redis:6379
      RABBITMQ_ENABLED: 'true'
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      BULLMQ_PREFIX: monorepo
      AUTH_GRPC_URL: auth:5001
      MONGO_ENABLED: 'true'
      MONGO_URL: mongodb://mongodb:27017/monorepo
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: monorepo-uploads
      S3_REGION: us-east-1
      CHOKIDAR_USEPOLLING: 'true'
    command:
      - sh
      - -lc
      - corepack enable && pnpm install && pnpm run build:packages && pnpm run db:push:api && pnpm --filter api dev
    ports:
      - '3001:3001'
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - pnpm-store:/pnpm/store
    labels:
      - traefik.enable=true
      # Route /api/v1/* to the api service, protected by JWT via forwardAuth
      - traefik.http.routers.api.rule=PathPrefix(`/api/v1`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.routers.api.middlewares=jwt-verify
      - traefik.http.services.api.loadbalancer.server.port=3001

  web:
    image: node:24-alpine
    container_name: monorepo-web-dev
    working_dir: /workspace
    depends_on:
      api:
        condition: service_started
    environment:
      WEB_PORT: '5173'
      WEB_URL: http://web:5173
      API_PORT: '3001'
      API_URL: http://api:3001
      PUBLIC_API_BASE_PATH: /api/v1
      BULLMQ_ENABLED: 'true'
      REDIS_URL: redis://redis:6379
      RABBITMQ_ENABLED: 'true'
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      AUTH_SERVICE_URL: http://auth:3002
      BULLMQ_PREFIX: monorepo
      CHOKIDAR_USEPOLLING: 'true'
    command:
      - sh
      - -lc
      - corepack enable && pnpm install && pnpm run build:packages && pnpm --filter web dev --host 0.0.0.0
    ports:
      - '5173:5173'
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - pnpm-store:/pnpm/store
    labels:
      - traefik.enable=true
      # Catch-all — lowest priority, everything not matched by /api/* goes to the web app
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.services.web.loadbalancer.server.port=5173

volumes:
  node_modules:
  pnpm-store:
  postgres-data:
  redis-data:
  rabbitmq-data:
  mongodb-data:
  minio-data:
